[package]
name = "iplayer"
version = "0.2.0"
edition = "2024"
description = "iPlayer — 基于 GPUI 的本地媒体播放器"
license = "MIT"

[dependencies]
# UI 框架：gpui-kit 一个 crate 带上 GPUI 本体 + 组件库 + 图标集
gpui-kit = "0.7.1"

# 原始帧 -> 纹理。版本必须与 gpui-pre 一致（0.25.10），否则 image::Frame 不是同一个类型。
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
] }
smallvec = "1"

# 异步通道 / 定时器（gpui 的 executor 兼容）
smol = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 音频输出（CoreAudio / WASAPI / ALSA）
cpal = "0.16"

# 原生文件 / 文件夹选择对话框
rfd = "0.15"

# SVG 渲染（usvg 解析 + tiny-skia 光栅化）。
# 版本与特性都和 gpui-pre 自己用的那份对齐 —— 否则会编译出两套 usvg/tiny-skia。
resvg = { version = "0.46", default-features = false, features = [
    "text",
    "system-fonts",
    "raster-images",
] }

# 拿到窗口的原生句柄（macOS 下是 NSView），用来做全屏 / 窗口置顶。
raw-window-handle = "0.6"

# 与 gpui-pre-macos 使用的版本保持一致，直接复用已编译的产物。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
# 无头指针模拟（TestAppContext / VisualTestContext）需要 test-support。
# 与 gpui-kit 依赖的是同一个包，特性合并、类型同一。
gpui = { version = "=0.3.8", package = "gpui-pre", features = ["test-support"] }

[profile.release]
# 保持 unwind：panic=abort 会让 ObjC 异常无法被捕获，直接 abort 进程
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

# GPUI 与解析类库在 debug 下也开优化，否则交互明显卡顿
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
image = { opt-level = 3 }
