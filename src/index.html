<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPlayer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- ── title bar ─────────────────────────────────────────────── -->
      <header id="titlebar">
        <div class="tb-drag" data-tauri-drag-region></div>
        <div class="tb-left">
          <button class="icon-btn" id="btn-sidebar" data-icon="panelLeft" title="收起 / 展开文件列表 (Ctrl+B)"></button>
        </div>
        <div class="tb-center">
          <span class="brand">iPlayer</span>
          <span class="brand-sub" id="tb-sub">视频播放器</span>
        </div>
        <div class="tb-right">
          <button class="icon-btn" id="btn-pin" data-icon="pin" title="窗口置顶 (T)"></button>
          <button class="icon-btn" id="btn-theme" data-icon="theme" title="主题：跟随系统 (Ctrl+T)"></button>
          <button class="icon-btn win-only" id="btn-min" data-icon="minimize" title="最小化"></button>
          <button class="icon-btn win-only" id="btn-max" data-icon="maximize" title="最大化 / 还原"></button>
          <button class="icon-btn win-only danger" id="btn-close" data-icon="close" title="关闭"></button>
        </div>
      </header>

      <!-- ── body ──────────────────────────────────────────────────── -->
      <main id="main">
        <aside id="sidebar">
          <div class="side-head">
            <button class="btn ghost sm" id="btn-open-file" data-icon="film" data-label="打开文件"></button>
            <button class="btn ghost sm" id="btn-open-folder" data-icon="folder" data-label="打开文件夹"></button>
            <button class="icon-btn" id="btn-refresh" data-icon="refresh" title="重新扫描当前文件夹"></button>
            <button class="icon-btn" id="btn-clear-list" data-icon="close" title="清空列表"></button>
          </div>
          <div class="side-path" id="side-path">
            <span class="side-path-text" id="side-path-text"></span>
            <button class="icon-btn tiny" id="btn-reveal-dir" data-icon="external" title="在访达中显示"></button>
          </div>
          <div class="side-search">
            <span class="search-icon" data-icon="search"></span>
            <input id="search" type="text" placeholder="筛选文件名…" autocomplete="off" spellcheck="false" />
            <button class="icon-btn tiny hidden" id="btn-clear-search" data-icon="close"></button>
          </div>
          <div class="side-filter">
            <button class="chip active" data-filter="all">全部</button>
            <button class="chip" data-filter="video">视频</button>
            <button class="chip" data-filter="audio">音频</button>
            <button class="chip" data-filter="image">图片</button>
            <label class="switch" title="包含子文件夹"><input type="checkbox" id="chk-recursive" /><span></span>子目录</label>
          </div>
          <ul id="file-list" class="file-list"></ul>
        </aside>

        <section id="stage">
          <div id="video-wrap">
            <video id="video" playsinline preload="metadata"></video>
            <img id="image" class="hidden" alt="" />
          </div>

          <div id="empty" class="stage-empty">
            <div class="empty-card">
              <div class="empty-logo"><img src="assets/logo.png" alt="iPlayer" /></div>
              <h1>iPlayer</h1>
              <p class="muted">打开一个文件夹，或把文件直接拖到这里</p>
              <div class="empty-actions">
                <button class="btn ghost" id="btn-empty-file" data-icon="film" data-label="打开文件"></button>
                <button class="btn ghost" id="btn-empty-folder" data-icon="folder" data-label="打开文件夹"></button>
              </div>
              <div class="empty-formats">
                MP4 · MKV · AVI · MOV · WMV · FLV · RMVB · TS · WebM · MP3 · FLAC · APE · JPG · PNG · GIF · WebP …
              </div>
            </div>
          </div>

          <div id="dropzone" class="dropzone hidden">
            <div class="dz-inner" data-icon="download"></div>
            <p>松开以播放</p>
          </div>

          <div id="busy" class="busy hidden">
            <div class="busy-card">
              <div class="spinner"></div>
              <div class="busy-label" id="busy-label">正在处理…</div>
              <div class="progress"><div class="progress-fill" id="busy-bar"></div></div>
              <div class="busy-sub"><span id="busy-pct">0%</span><span id="busy-note"></span></div>
            </div>
          </div>

          <div id="toast-host" class="toast-host"></div>

          <div class="osd" id="osd"></div>
        </section>
      </main>

      <!-- ── control bar ───────────────────────────────────────────── -->
      <footer id="controls">
        <div class="seek-row">
          <div class="seek" id="seek">
            <div class="seek-track">
              <div class="seek-buffer" id="seek-buffer"></div>
              <div class="seek-played" id="seek-played"></div>
            </div>
            <div class="seek-handle" id="seek-handle"></div>
            <div class="seek-tip" id="seek-tip">00:00</div>
          </div>
        </div>

        <div class="ctrl-row">
          <div class="ctrl-group left">
            <span class="time"><b id="t-cur">00:00</b><i>/</i><span id="t-dur">00:00</span></span>
          </div>

          <div class="ctrl-group center">
            <button class="icon-btn lg" id="btn-prev" data-icon="prev" title="上一个 (P)"></button>
            <button class="icon-btn xl play" id="btn-play" data-icon="play" title="播放 / 暂停 (空格)"></button>
            <button class="icon-btn lg" id="btn-next" data-icon="next" title="下一个 (N)"></button>
            <button class="icon-btn big-ico" id="btn-stop" data-icon="stop" title="停止 (Ctrl+.)"></button>
          </div>

          <div class="ctrl-group right">
            <div class="vol">
              <button class="icon-btn" id="btn-mute" data-icon="volume" title="静音 (M)"></button>
              <input type="range" id="volume" class="range sm" min="0" max="100" step="1" value="100" aria-label="音量" />
            </div>
            <button class="icon-btn" id="btn-summary" data-icon="info" title="媒体信息 (I)"></button>
            <select id="speed" class="select" title="播放速度">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
              <option value="2.5">2.5x</option>
              <option value="3">3.0x</option>
            </select>
            <button class="icon-btn" id="btn-loop" data-icon="repeat" title="循环：关闭"></button>
            <button class="icon-btn" id="btn-shot" data-icon="camera" title="截图 (S)"></button>
            <button class="icon-btn" id="btn-tools" data-icon="toolbox" title="工具箱 (G)"></button>
            <button class="icon-btn" id="btn-full" data-icon="expand" title="全屏 (F)"></button>
          </div>
        </div>
      </footer>
    </div>

    <!-- ── modal ───────────────────────────────────────────────────── -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel" role="dialog" aria-modal="true">
        <header class="modal-head">
          <div class="tabs" id="modal-tabs">
            <button class="tab active" data-tab="shot" data-icon="camera">截图</button>
            <button class="tab" data-tab="audio" data-icon="music">音频</button>
            <button class="tab" data-tab="gif" data-icon="gif">GIF</button>
            <button class="tab" data-tab="info" data-icon="info">信息</button>
            <button class="tab" data-tab="settings" data-icon="settings">设置</button>
          </div>
          <button class="icon-btn" data-close data-icon="close" title="关闭 (Esc)"></button>
        </header>
        <div class="modal-progress hidden" id="modal-progress">
          <div class="mp-track"><div class="mp-fill" id="modal-progress-fill"></div></div>
          <span class="mp-note" id="modal-progress-note"></span>
        </div>
        <div class="modal-body">
          <!-- snapshot -->
          <section class="pane active" data-pane="shot">
            <div class="field">
              <label>截图时间点</label>
              <div class="row">
                <input type="text" id="shot-time" class="input mono" value="00:00:00.000" />
                <button class="btn ghost sm" id="shot-use-current">用当前位置</button>
                <button class="btn ghost sm" id="shot-set-start">设为选区起点</button>
              </div>
            </div>
            <div class="field">
              <label>保存到</label>
              <div class="row">
                <input type="text" id="shot-out" class="input" placeholder="留空则保存到视频同目录" />
                <button class="btn ghost sm" id="shot-pick">另存为…</button>
              </div>
            </div>
            <div class="pane-foot">
              <button class="btn primary" id="shot-run" data-icon="camera" data-label="保存截图"></button>
            </div>
          </section>

          <!-- audio -->
          <section class="pane" data-pane="audio">
            <div class="field">
              <label>输出格式</label>
              <div class="seg" id="audio-format">
                <button class="seg-item active" data-value="m4a">M4A (AAC)</button>
                <button class="seg-item" data-value="mp3">MP3</button>
                <button class="seg-item" data-value="wav">WAV</button>
                <button class="seg-item" data-value="flac">FLAC</button>
                <button class="seg-item" data-value="copy">原样复制</button>
              </div>
              <p class="hint">「原样复制」不重新编码，速度最快，输出为原始音频流容器。</p>
            </div>
            <div class="field">
              <label>保存到</label>
              <div class="row">
                <input type="text" id="audio-out" class="input" placeholder="留空则保存到视频同目录" />
                <button class="btn ghost sm" id="audio-pick">另存为…</button>
              </div>
            </div>
            <div class="pane-foot">
              <button class="btn primary" id="audio-run" data-icon="music" data-label="提取音频"></button>
            </div>
          </section>

          <!-- gif -->
          <section class="pane" data-pane="gif">
            <div class="field">
              <label>时间区间</label>
              <div class="row">
                <input type="text" id="gif-start" class="input mono" value="00:00:00.000" />
                <span class="dash">→</span>
                <input type="text" id="gif-end" class="input mono" value="00:00:00.000" />
                <button class="btn ghost sm" id="gif-use-current">当前为起点</button>
                <button class="btn ghost sm" id="gif-use-end">当前为终点</button>
              </div>
              <p class="hint" id="gif-len">区间长度 0.0 秒</p>
            </div>
            <div class="field">
              <label>参数</label>
              <div class="params">
                <label class="param"><span>帧率</span><input type="number" id="gif-fps" class="input sm mono" value="12" min="1" max="50" /></label>
                <label class="param"><span>宽度</span><input type="number" id="gif-width" class="input sm mono" value="480" min="32" max="1920" step="2" /></label>
                <label class="param check"><input type="checkbox" id="gif-dither" checked /><span>抖动优化画质</span></label>
              </div>
            </div>
            <div class="field">
              <label>保存到</label>
              <div class="row">
                <input type="text" id="gif-out" class="input" placeholder="留空则保存到视频同目录" />
                <button class="btn ghost sm" id="gif-pick">另存为…</button>
              </div>
            </div>
            <div class="pane-foot">
              <button class="btn primary" id="gif-run" data-icon="gif" data-label="生成 GIF"></button>
              <span class="hint">长区间 / 高帧率会明显变慢</span>
            </div>
          </section>

          <!-- info -->
          <section class="pane" data-pane="info">
            <div class="info-grid" id="info-grid"></div>
            <div class="pane-foot">
              <button class="btn ghost" id="info-copy" data-icon="copy" data-label="复制信息"></button>
              <button class="btn ghost" id="info-reveal" data-icon="external" data-label="在访达中显示"></button>
            </div>
          </section>

          <!-- settings -->
          <section class="pane" data-pane="settings">
            <div class="field">
              <label>主题</label>
              <div class="seg" id="set-theme">
                <button class="seg-item" data-value="system">跟随系统</button>
                <button class="seg-item" data-value="light">浅色</button>
                <button class="seg-item active" data-value="dark">深色</button>
              </div>
            </div>
            <div class="field">
              <label>窗口</label>
              <div class="toggle-list">
                <label class="toggle"><input type="checkbox" id="set-ontop" /><span class="track"></span><span class="txt">窗口置顶（前置显示）</span></label>
                <label class="toggle"><input type="checkbox" id="set-fixed" /><span class="track"></span><span class="txt">固定窗口大小（禁止调整）</span></label>
              </div>
            </div>
            <div class="field">
              <label>播放</label>
              <div class="toggle-list">
                <label class="toggle"><input type="checkbox" id="set-autoplay" checked /><span class="track"></span><span class="txt">打开文件后自动播放</span></label>
                <label class="toggle"><input type="checkbox" id="set-autonext" checked /><span class="track"></span><span class="txt">播放结束后自动播放下一个</span></label>
                <label class="toggle"><input type="checkbox" id="set-resume" checked /><span class="track"></span><span class="txt">记住每个文件的播放进度</span></label>
              </div>
            </div>
            <div class="field">
              <label>画面</label>
              <div class="seg" id="set-fit">
                <button class="seg-item active" data-value="contain">适应窗口</button>
                <button class="seg-item" data-value="cover">铺满裁切</button>
                <button class="seg-item" data-value="fill">拉伸铺满</button>
                <button class="seg-item" data-value="none">原始尺寸</button>
              </div>
            </div>
            <div class="field">
              <label>环境</label>
              <div class="env-box" id="env-box"></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
