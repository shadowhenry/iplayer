<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; height: auto; overflow: visible; }
  .shell { height: 560px; display: flex; flex-direction: column; background: var(--bg); }
  .fake-bar { flex: none; height: 96px; background: var(--panel); border-top: 1px solid var(--border-soft); }
  #probe { font: 12px/1.5 monospace; color: #9aa4b2; padding: 6px; }
</style>
</head>
<body>
<div class="shell">
  <div id="app" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <main id="main">
      <aside id="sidebar" style="width:0;border:0"></aside>
      <section id="stage">
        <div id="video-wrap">
          <video id="video" playsinline preload="metadata"></video>
          <img id="image" class="hidden" alt="" />
        </div>
        <div id="viz" class="hidden"><canvas></canvas></div>
      </section>
    </main>
  </div>
  <div class="fake-bar"></div>
</div>
<div id="probe">booting…</div>

<script>
  // drive the visualiser's rAF loop synchronously so a headless screenshot
  // catches a mid-animation state (media clock never advances headless)
  let vt = 1000, driveFrames = 0, driven = 0;
  const realRaf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = (cb) => {
    if (driveFrames > 0) { driveFrames--; driven++; vt += 16.7; cb(vt); return 0; }
    return realRaf(cb);
  };
  window.__drive = (n) => { driveFrames = n; };
  window.__driven = () => driven;
</script>
<script src="viz.js"></script>
<script>
(() => {
  const stageW = document.getElementById("stage");
  const viz = window.Viz;
  viz.mount(document.getElementById("viz"));

  const media = document.getElementById("video");
  media.src = "file:///tmp/viztest.wav";

  let graph = null;
  function start() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(media);
      const node = ctx.createAnalyser();
      node.fftSize = 2048;
      node.smoothingTimeConstant = 0.72;
      node.minDecibels = -72;
      node.maxDecibels = -18;
      src.connect(node);
      node.connect(ctx.destination);
      graph = { ctx, node, data: new Uint8Array(node.frequencyBinCount) };
      viz.attachAnalyser(node, graph.data);
      ctx.resume();
    } catch (e) {
      document.getElementById("probe").textContent = "graph failed: " + e;
    }
    viz.show();
    viz.setPlaying(true);
    window.__drive(300);
    media.play().catch(e => { document.getElementById("probe").textContent = "play err: " + e; });
  }

  media.addEventListener("loadedmetadata", start, { once: true });

  setInterval(() => {
    document.getElementById("probe").textContent =
      `probe: mode=${viz.mode} | raf=${window.__driven()} | docHidden=${document.hidden} | t=${media.currentTime.toFixed(2)}s | paused=${media.paused} | vol=${media.volume} | dbg=${JSON.stringify(viz.__dbg())}`;
  }, 200);
})();
</script>
</body>
</html>
